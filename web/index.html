<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lurraldebus · Comparador de viajes</title>
<meta name="description" content="Horarios de Lurraldebus (Gipuzkoa) claros y comparables: todos los autobuses del día entre dos municipios.">
<meta name="theme-color" content="#d6001c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d6001c'/%3E%3Cpath d='M8 9h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2zm0 3v4h16v-4zm3 9a1.5 1.5 0 1 0 0 .1zm10 0a1.5 1.5 0 1 0 0 .1z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#fff"/><path d="M8 9h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2zm0 3v4h16v-4z" fill="#d6001c"/><circle cx="11" cy="23.5" r="1.6" fill="#d6001c"/><circle cx="21" cy="23.5" r="1.6" fill="#d6001c"/></svg>
    <div>
      <h1>Lurraldebus <span>comparador de viajes</span></h1>
      <p id="validity"></p>
    </div>
  </div>
</header>

<main>
  <form id="form" class="panel" autocomplete="off">
    <div class="route">
      <label>Origen
        <select id="o"></select>
        <select id="os" class="stop" aria-label="Parada de origen"></select>
      </label>
      <button type="button" id="swap" class="icon" title="Intercambiar origen y destino" aria-label="Intercambiar origen y destino">⇄</button>
      <label>Destino
        <select id="d"></select>
        <select id="ds" class="stop" aria-label="Parada de destino"></select>
      </label>
    </div>

    <div class="when">
      <div class="field">
        <span class="lbl">Día</span>
        <div class="daynav">
          <button type="button" id="prev" class="icon" aria-label="Día anterior">‹</button>
          <input type="date" id="date" required aria-label="Día">
          <button type="button" id="next" class="icon" aria-label="Día siguiente">›</button>
        </div>
      </div>
      <div class="field">
        <span class="lbl">&nbsp;</span>
        <div class="seg" id="dayq">
          <button type="button" data-day="0">Hoy</button>
          <button type="button" data-day="1">Mañana</button>
        </div>
      </div>
      <div class="field">
        <span class="lbl">Desde las</span>
        <input type="time" id="time" aria-label="Hora de salida mínima">
      </div>
      <div class="field">
        <span class="lbl">&nbsp;</span>
        <div class="seg">
          <button type="button" id="now">Ahora</button>
          <button type="button" id="allday">Todo el día</button>
        </div>
      </div>
    </div>

    <div class="opts">
      <label class="toggle"><input type="checkbox" id="transfers" checked><span>Incluir trasbordos</span></label>
      <label class="toggle"><input type="checkbox" id="holiday"><span>Festivo <small>(horario de domingo)</small></span></label>
    </div>
  </form>

  <section id="out" aria-live="polite"><p class="empty">Cargando horarios…</p></section>
</main>

<footer>
  Datos: GTFS oficiales de Lurraldebus (Punto de Acceso Nacional de Transporte, licencia abierta), actualizados a diario.
  Son horarios programados, sin tiempo real. Revisa siempre la <a href="https://lurraldebus.eus" rel="noopener">web oficial</a> ante cambios o incidencias.
</footer>

<script src="search.js"></script>
<script src="app.js"></script>
</body>
</html>
